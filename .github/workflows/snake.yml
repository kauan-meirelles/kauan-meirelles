name: Generate Snake e Pacman

on:
  schedule:
    - cron: "0 0 * * *" # executa todo dia à meia-noite
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/snake.yml"]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      # Os dois geradores escrevem em dist/ e são publicados juntos;
      # publicar em passos separados fazia um apagar os arquivos do outro.
      - name: Gerar o Pacman
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}

      - name: Gerar a cobrinha
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=006400
            dist/github-snake-dark.svg?palette=github-dark&color_snake=3fb950

      - name: Publicar na branch output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
